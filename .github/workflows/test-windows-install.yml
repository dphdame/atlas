# Cross-platform install + smoke for ATLAS. The filename is kept from the
# Windows-only workflow so existing GitHub settings and run history still match.
# Each job provisions .venv through the real launcher in check-only mode, adds
# Playwright Chromium to that .venv, then runs the unit tests and the 5-stage
# smoke suite (offline guard, launcher recovery, CLI pipeline, headless-browser
# upload/download flow, anti-shortcut gate and codebook audit).
name: ATLAS Install & Smoke (Windows + Ubuntu)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: run.bat --check-only + 5-stage smoke on windows-latest
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Provision .venv with run.bat --check-only
        shell: cmd
        # --check-only provisions .venv, installs requirements.txt, writes the
        # dependency marker and verifies imports, then exits without launching or pausing.
        run: call run.bat --check-only

      - name: Verify dependency marker
        shell: cmd
        run: |
          if not exist .venv\.atlas_deps.sha256 exit /b 1
          type .venv\.atlas_deps.sha256

      - name: Install Playwright into .venv
        shell: cmd
        run: .venv\Scripts\python.exe -m pip install --disable-pip-version-check playwright

      - name: Install Playwright Chromium
        shell: cmd
        run: .venv\Scripts\python.exe -m playwright install chromium

      - name: Unit tests
        shell: cmd
        run: .venv\Scripts\python.exe -m unittest discover -s tests -v

      - name: 5-stage smoke suite
        shell: cmd
        run: .venv\Scripts\python.exe scripts\smoke_test.py --max-stage 5

  ubuntu:
    name: run.command --check-only + 5-stage smoke on ubuntu-latest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Provision .venv with run.command --check-only
        shell: bash
        run: bash run.command --check-only

      - name: Verify dependency marker
        shell: bash
        run: |
          test -s .venv/.atlas_deps.sha256
          cat .venv/.atlas_deps.sha256

      - name: Install Playwright into .venv
        shell: bash
        run: .venv/bin/python -m pip install --disable-pip-version-check playwright

      - name: Install Playwright Chromium with system dependencies
        shell: bash
        run: .venv/bin/python -m playwright install --with-deps chromium

      - name: Unit tests
        shell: bash
        run: .venv/bin/python -m unittest discover -s tests -v

      - name: 5-stage smoke suite
        shell: bash
        run: .venv/bin/python scripts/smoke_test.py --max-stage 5
