# Paid Family Leave & Small Employer Policy Evaluation Codebook
# Methodological Reference Codebook for ATLAS Qualitative-to-Actuarial Pipeline

project: "Paid Family Leave Small Employer Compliance & Take-Up Study"
version: "1.0.0"
languages: ["en", "es"]

domains:
  - id: "PFL_GAP"
    name: "Job Protection & Leave Duration Gap"
    description: "Mismatch between 12-week job-protected leave (CFRA) and 8-week wage replacement, creating an unpaid cliff for weeks 9-12."
    roots_en:
      - "unpaid week"
      - "4-week gap"
      - "four week gap"
      - "weeks 9"
      - "twelve week"
      - "job protection"
      - "cfra"
      - "unprotected"
      - "exhausted benefit"
    roots_es:
      - "semanas no pagadas"
      - "brecha de cuatro semanas"
      - "sin sueldo"
      - "proteccion laboral"
      - "se agoto el beneficio"
    context_fences:
      - "leave"
      - "duration"
      - "weeks"
      - "job"
      - "income"
      - "permiso"
      - "trabajo"

  - id: "PFL_REPLACE"
    name: "Replacement Worker & Cross-Training Overhead"
    description: "Operational difficulty and costs incurred by small employers to hire, cross-train, or pay overtime to cover absent staff."
    roots_en:
      - "replacement worker"
      - "temporary hire"
      - "temp agency"
      - "cross-train"
      - "cover shifts"
      - "overtime cost"
      - "short-staffed"
      - "workload backlog"
    roots_es:
      - "trabajador de reemplazo"
      - "empleado temporal"
      - "capacitar"
      - "cubrir turnos"
      - "horas extras"
      - "falta de personal"
    context_fences:
      - "employer"
      - "staff"
      - "shift"
      - "cost"
      - "small business"
      - "negocio"
      - "empleador"

  - id: "PFL_WAGE"
    name: "Wage Replacement Sufficiency & Low-Wage Take-Up"
    description: "Financial insufficiency of partial wage replacement (70% rate) for hourly workers, depressing take-up among low-income households."
    roots_en:
      - "70 percent"
      - "seventy percent"
      - "wage replacement"
      - "partial pay"
      - "cannot afford leave"
      - "living paycheck"
      - "afford to take"
      - "full wage"
    roots_es:
      - "70 por ciento"
      - "setenta por ciento"
      - "reemplazo salarial"
      - "pago parcial"
      - "no me alcanza"
      - "sueldo completo"
    context_fences:
      - "wage"
      - "pay"
      - "salary"
      - "rent"
      - "afford"
      - "income"
      - "salario"
      - "ingreso"

  - id: "PFL_PORTAL"
    name: "Administrative Portal & Certification Delays"
    description: "Friction navigating state administrative portals, physician medical certification delays, and identity verification hurdles."
    roots_en:
      - "edd portal"
      - "id.me"
      - "identity verification"
      - "physician form"
      - "medical certificate"
      - "claim delay"
      - "portal crash"
      - "paper application"
    roots_es:
      - "portal de edd"
      - "verificacion de identidad"
      - "certificado medico"
      - "formulario medico"
      - "demora en el reclamo"
      - "solicitud en papel"
    context_fences:
      - "claim"
      - "portal"
      - "edd"
      - "doctor"
      - "application"
      - "reclamo"
      - "solicitud"

  - id: "PFL_STIGMA"
    name: "Workplace Stigma & Informal Retaliation"
    description: "Worker apprehension regarding informal workplace penalties, schedule reductions, or career stagnation upon taking leave."
    roots_en:
      - "retaliation"
      - "cut hours"
      - "reduced shifts"
      - "feared asking"
      - "manager pushback"
      - "penalized"
      - "passed over"
    roots_es:
      - "represalia"
      - "reduccion de horas"
      - "miedo de pedir"
      - "rechazo del gerente"
      - "penalizado"
    context_fences:
      - "boss"
      - "manager"
      - "supervisor"
      - "job"
      - "work"
      - "hours"
      - "jefe"
      - "horas"
