# ATLAS Core Evaluation Themes: Social-Policy & Guaranteed Basic Income Starter
# Generic, public-safe starter domains aligned to the 10 core safety-net / GBI
# outcome areas. Roots are word-start prefixes ("evict" also matches "eviction"),
# paired with explicit complete-word forms so opt-in spelling tolerance works
# cleanly under distance-1 whole-token matching. Exclusion fences with
# exclude_window: 0 drop only a root occurrence sharing a token with the fence.
project: "Core Evaluation Themes (Social Policy & GBI)"
version: "2.0"

domains:
  - id: "housing_rent_stability"
    name: "Housing & Rent Stability"
    description: "Paying rent, keeping housing, deposits, moves, eviction risk, shelter and landlord relations"
    roots_en:
      - "rent"
      - "housing"
      - "landlord"
      - "evict"
      - "eviction"
      - "mortgage"
      - "security deposit"
      - "apartment"
      - "homeless"
      - "shelter"
      - "lease"
      - "utilities"
    exclude_fences:
      - "parent"
      - "parents"
      - "current"
      - "currently"
      - "different"
      - "rental car"
      - "car rental"
    exclude_window: 0

  - id: "food_groceries_basic_needs"
